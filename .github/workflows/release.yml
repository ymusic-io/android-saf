name: Release

# A v<versionName> tag publishes android-saf.apk as the latest GitHub release, the file YMusic's remote config
# links to. A manual run only builds it, as an artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: android-saf

      # Signed with YMusic's own release key — the picker answers only apps signed like itself, and YMusic opens only
      # a helper signed like itself. The key comes from YMusicV4's sealed secrets.enc, opened with the same
      # SECRETS_PASSPHRASE secret YMusicV4 uses.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ymusic-io/YMusicV4
          path: YMusicV4
          fetch-depth: 1
          sparse-checkout: |
            secrets.enc
            decrypt.sh
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android-saf
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' build.gradle.kts)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "tag $GITHUB_REF_NAME but versionName is $version" >&2; exit 1; }

      - name: Build, signed with YMusic's key
        env:
          SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
        run: |
          [[ -n "$SECRETS_PASSPHRASE" ]] || { echo "SECRETS_PASSPHRASE is not set: the helper must be signed with YMusic's key" >&2; exit 1; }
          YMusicV4/decrypt.sh
          prop() { sed -n "s/^$1=//p" YMusicV4/secrets.properties | tail -n 1; }
          export YMUSIC_ANDROID_STORE_FILE="$GITHUB_WORKSPACE/YMusicV4/$(prop android.signing.storeFile)"
          export YMUSIC_ANDROID_STORE_PASSWORD="$(prop android.signing.storePassword)"
          export YMUSIC_ANDROID_KEY_ALIAS="$(prop android.signing.keyAlias)"
          export YMUSIC_ANDROID_KEY_PASSWORD="$(prop android.signing.keyPassword)"
          [[ -n "$YMUSIC_ANDROID_KEY_PASSWORD" ]] || export YMUSIC_ANDROID_KEY_PASSWORD="$YMUSIC_ANDROID_STORE_PASSWORD"
          [[ -f "$YMUSIC_ANDROID_STORE_FILE" ]] || { echo "the decrypted secrets hold no keystore" >&2; exit 1; }
          (cd android-saf && ./gradlew --no-daemon assembleRelease)
          cp android-saf/build/outputs/apk/release/android-saf-release.apk "$RUNNER_TEMP/android-saf.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$RUNNER_TEMP/android-saf.apk" | grep -i "SHA-256"

      - name: Discard secrets
        if: always()
        run: rm -rf YMusicV4/secrets.properties YMusicV4/signing

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-saf
          path: ${{ runner.temp }}/android-saf.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/android-saf.apk" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --latest
