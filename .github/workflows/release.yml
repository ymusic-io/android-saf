name: Release

# A release-v<versionName> tag publishes android-saf.apk as the latest GitHub release, the file YMusic's remote
# config links to. A manual run only builds it, as an artifact.
on:
  push:
    tags: ['release-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      # Only whether secrets.enc can be opened: the passphrase itself goes to the Restore secrets step alone.
      HAS_SECRETS: ${{ secrets.SECRETS_PASSPHRASE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' build.gradle.kts)
          [[ "release-v$version" == "$GITHUB_REF_NAME" ]] || { echo "tag $GITHUB_REF_NAME but versionName is $version" >&2; exit 1; }

      # secrets.enc → secrets.properties + signing/: YMusic's release key. YMusic opens only a helper signed like
      # itself, so a release without it would be useless — the tagged run refuses to go on unsigned.
      - name: Restore secrets
        if: env.HAS_SECRETS == 'true'
        env:
          SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
        run: ./decrypt.sh

      - name: Refuse an unsigned release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SECRETS != 'true'
        run: |
          echo "SECRETS_PASSPHRASE is not set: a release must be signed with YMusic's key" >&2
          exit 1

      - name: Build
        run: |
          ./gradlew --no-daemon assembleRelease
          cp build/outputs/apk/release/android-saf-release.apk "$RUNNER_TEMP/android-saf.apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$RUNNER_TEMP/android-saf.apk" | grep -i "SHA-256"

      - name: Discard secrets
        if: always()
        run: rm -rf secrets.properties signing

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-saf
          path: ${{ runner.temp }}/android-saf.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/android-saf.apk" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --latest
